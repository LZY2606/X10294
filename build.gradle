plugins {
    id 'java'
    id 'application'
}

group = 'a429'
version = '1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

repositories { mavenCentral() }

dependencies {
    implementation 'io.javalin:javalin:6.7.0'
    implementation 'org.xerial:sqlite-jdbc:3.47.1.0'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jsr310:2.18.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'io.javalin:javalin:6.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'a429.Main'
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8']
}

// Offline case pack lives at the repository root and is also copied to the
// classpath so a packaged jar remains self-contained.
sourceSets {
    main {
        resources {
            srcDir layout.projectDirectory.dir('webapp')
            srcDir layout.projectDirectory.dir('case-pack')
        }
    }
}

processResources { duplicatesStrategy = DuplicatesStrategy.EXCLUDE }

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.register('copyCasePack', Copy) {
    from layout.projectDirectory.dir('case-pack')
    into layout.buildDirectory.dir('case-pack')
}
