plugins {
    id 'java'
    id 'application'
}

group = 'org.avionics'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.javalin:javalin:6.5.0'
    implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'org.slf4j:slf4j-simple:2.0.16'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'org.avionics.review.App'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('jar') {
    manifest {
        attributes('Main-Class': 'org.avionics.review.App')
    }
}

tasks.register('generateCasePack', JavaExec) {
    group = 'avionics'
    description = 'Regenerates the bundled ARINC 429 case pack JSON'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.avionics.review.casepack.ResourceGenerator'
    args = ['src/main/resources/casepack/arinc429-word-decoder-bench.json']
}
